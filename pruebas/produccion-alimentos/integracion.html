<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <base href="/" />
  <title>Integración Producción de alimentos</title>
  <style>
    html, body { margin: 0; background: #05070d; color: #dbe6ff; font: 12px monospace; }
    #out { white-space: pre-wrap; padding: 8px; }
    canvas { width: 320px; height: 180px; }
    .ok { color: #6fe3a1; } .bad { color: #ff6b6b; }
  </style>
</head>
<body>
  <canvas id="game" width="320" height="180"></canvas>
  <pre id="out">EJECUTANDO...</pre>
  <script type="module">
    import { Game } from '../../src/core/Game.js';
    import { InteriorBaseScene } from '../../src/scenes/InteriorBaseScene.js';
    import { ProduccionAlimentosScene } from '../../src/scenes/ProduccionAlimentosScene.js';

    const out = document.getElementById('out');
    const checks = [];
    const pass = (m) => checks.push({ ok: true, msg: m });
    const fail = (m) => checks.push({ ok: false, msg: m });

    const espera = async (fn, ms = 20000) => {
      const t0 = performance.now();
      while (performance.now() - t0 < ms) {
        if (fn()) return true;
        await new Promise((r) => setTimeout(r, 100));
      }
      return false;
    };

    (async () => {
      try {
        const canvas = document.getElementById('game');
        const game = new Game(canvas);
        const interior = new InteriorBaseScene(game, {});
        game.setScene(interior);
        await game.init();
        game.beginPlay();
        pass(`juego iniciado (estado ${game.state})`);

        // El interior debe estar activo
        if (game.scene instanceof InteriorBaseScene) pass('escena interior activa');
        else fail('la escena inicial no es InteriorBaseScene');

        // Abrir el módulo como lo hace el juego: zona de interacción + E
        const zonasAlimentos = interior.interactables.filter((z) => z.name === 'CONTROL DE ALIMENTACIÓN');
        if (zonasAlimentos.length === 4) pass(`zonas de interacción del módulo: ${zonasAlimentos.length}`);
        else fail(`se esperaban 4 zonas del módulo, hay ${zonasAlimentos.length}`);
        const zonaAlimentos = zonasAlimentos[0];
        if (zonaAlimentos && zonaAlimentos.onConfirm) pass('la zona tiene acción de interacción');
        else fail('la zona del módulo no tiene onConfirm');

        zonaAlimentos.onConfirm(zonaAlimentos, interior.player);
        const abrio = await espera(() => game.scene instanceof ProduccionAlimentosScene && game.scene.minigame);
        if (abrio) pass('el módulo de alimentos se abrió desde el interior');
        else { fail('el módulo no se abrió'); throw new Error('sin módulo'); }

        const mg = game.scene.minigame;
        const faltan = Object.entries(mg.sprites).filter(([, v]) => !v).map(([k]) => k);
        if (faltan.length === 0) pass(`sprites en el juego real: ${Object.keys(mg.sprites).length}/62`);
        else fail(`sprites faltantes en el juego: ${faltan.join(', ')}`);

        if (Object.keys(mg.cultivos).length === 6) pass('config_cultivos.json cargado desde el pack');
        else fail('cultivos no cargados');

        // Un tick y un render reales
        game.update(1 / 60);
        let err = null;
        try { game.render(0); } catch (e) { err = e; }
        if (err) fail(`game.render lanzó: ${err.message}`);
        else pass('game.render del módulo sin excepciones');

        // Clic real: mover el ratón a APLICAR y disparar la acción del juego
        const zonaAplicar = mg._hit.find((z) => z.id === 'aplicar');
        if (!zonaAplicar) { fail('no se encontró el botón APLICAR en el render'); throw new Error('sin botón'); }
        game.mouse.x = zonaAplicar.x + zonaAplicar.w / 2;
        game.mouse.y = zonaAplicar.y + zonaAplicar.h / 2;
        const diaAntes = mg.day;
        game._onPointerAction();
        if (mg.day === diaAntes + 3) pass(`clic real en APLICAR: día ${diaAntes} -> ${mg.day}`);
        else fail(`el clic real en APLICAR no funcionó: ${diaAntes} -> ${mg.day}`);

        // Clic real en una tarjeta de cultivo
        game.render(0);
        const zonaCultivo = mg._hit.find((z) => z.id === 'cultivo:papa');
        game.mouse.x = zonaCultivo.x + zonaCultivo.w / 2;
        game.mouse.y = zonaCultivo.y + zonaCultivo.h / 2;
        game._onPointerAction();
        if (mg.selected === 'papa') pass('clic real cambia a PAPA');
        else fail(`clic real no cambió de cultivo: ${mg.selected}`);

        // Salir con ESC (a través del input real del juego) → vuelve al interior
        game.input._pressed.add('Escape');
        game.update(1 / 60);
        const volvio = await espera(() => game.scene instanceof InteriorBaseScene);
        if (volvio) pass('ESC sale del módulo y vuelve al interior');
        else fail('ESC no volvió al interior');

        // --- persistencia: al reabrir se conserva la simulación -------------
        const diaGuardado = mg.day;
        const cosechasGuardadas = mg.stats.cosechas;
        const zonasOtraVez = game.scene.interactables.filter((z) => z.name === 'CONTROL DE ALIMENTACIÓN');
        if (zonasOtraVez.length && zonasOtraVez[0].onConfirm) {
          zonasOtraVez[0].onConfirm();
          const reabrio = await espera(() => game.scene instanceof ProduccionAlimentosScene && game.scene.minigame);
          if (reabrio && game.scene.minigame === mg) pass('al reabrir se reutiliza la misma simulación');
          else fail('al reabrir no se conservó la instancia');
          if (game.scene.minigame && game.scene.minigame.day === diaGuardado && game.scene.minigame.stats.cosechas === cosechasGuardadas) {
            pass(`persistencia correcta: día ${diaGuardado}, cosechas ${cosechasGuardadas}`);
          } else fail('el estado se reinició al reabrir');
          // Salir de nuevo
          game.scene.minigame.onExit();
          await espera(() => game.scene instanceof InteriorBaseScene);
        } else {
          fail('las zonas del módulo desaparecieron tras volver');
        }

        // El interior reconstruido debe renderizar sin errores
        let err2 = null;
        try { game.update(1 / 60); game.render(0); } catch (e) { err2 = e; }
        if (!err2) pass('el interior reconstruido renderiza sin errores');
        else fail(`el interior reconstruido falló: ${err2.message}`);
      } catch (e) {
        fail(`EXCEPCIÓN: ${e && e.stack ? e.stack : e}`);
      }

      const ok = checks.filter((c) => c.ok).length;
      const bad = checks.length - ok;
      const resumen = `${bad === 0 ? 'PASS' : 'FAIL'} ${ok}/${checks.length}`;
      document.title = resumen;
      out.innerHTML = `<b class="${bad === 0 ? 'ok' : 'bad'}">${resumen}</b>\n` +
        checks.map((c) => `<span class="${c.ok ? 'ok' : 'bad'}">${c.ok ? '[OK]' : '[X ]'} ${c.msg}</span>`).join('\n');
      window.__RESULT__ = { resumen, checks };
    })();
  </script>
</body>
</html>
