<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Motor 2D - Prototipo</title>
  <style>
    @font-face {
      font-family: 'Press Start 2P';
      src: url('./assets/fonts/PressStart2P-Regular.ttf') format('truetype');
      font-display: swap;
    }
    :root { color-scheme: dark; }
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      color: #eee;
      font-family: system-ui, sans-serif;
    }
    #game-root {
      position: relative;
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
    }
    canvas {
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      display: block;
      background: #000;
    }
    #loading {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
      font-size: 16px;
      letter-spacing: 1px;
      pointer-events: none;
    }
    #loading.hidden { display: none; }
  </style>
</head>
<body>
  <div id="game-root">
    <canvas id="game"></canvas>
    <div id="loading">Cargando...</div>
  </div>
  <script type="module" src="./src/main.js"></script>
  <script type="module" src="./src/events/liveEventPanel.js"></script>
</body>
</html>
