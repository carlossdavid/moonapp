<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Entropía Cero — Base lunar</title>
  <style>
    @font-face {
      font-family: 'Press Start 2P';
      src: url('./assets/fonts/PressStart2P-Regular.ttf') format('truetype');
      font-display: swap;
    }
    :root { color-scheme: dark; }
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #050c14;
      color: #e8f1f1;
      font-family: system-ui, sans-serif;
    }
    #game-root {
      position: relative;
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #050c14;
    }
    #game {
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      display: block;
      background: #050c14;
    }
    #loading {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #050c14;
      font: 10px/1.8 'Press Start 2P', monospace;
      text-align: center;
      pointer-events: none;
    }
    #loading.hidden { display: none; }
  </style>
</head>
<body>
  <div id="game-root">
    <canvas id="game"></canvas>
    <video id="introVideo" autoplay muted playsinline style="position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#050c14;display:none;z-index:10;"></video>
    <div id="loading" role="status">Cargando base lunar…</div>
  </div>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
